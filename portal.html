<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#24c7bd"><title>Portal Admin & Tentor — BIMBEL FUN</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body class="portal-body"><main class="portal-wrap"><header class="portal-head"><a class="brand" href="index.html"><span class="brand-mark brand-logo" aria-hidden="true"></span><span><strong>BIMBEL <i>FUN</i></strong><small>Make Learning Fun</small></span></a><a href="index.html" class="text-link">← Kembali ke website</a></header>
<section id="loginPanel" class="portal-panel"><h1 id="loginTitle">Login</h1><p id="loginDescription" class="portal-muted">Masukkan username dan password akun Anda.</p><form id="loginForm" class="portal-form"><input id="email" type="text" placeholder="Username" autocomplete="username" required><input id="password" type="password" placeholder="Password" autocomplete="current-password" required><button class="portal-btn" type="submit">Masuk</button></form><p id="loginMessage" class="portal-muted" role="status"></p></section>
<section id="appPanel" class="portal-hidden"><div class="portal-panel"><div class="portal-head"><div><span class="eyebrow">BIMBEL FUN PORTAL</span><h1 id="welcome">Dashboard</h1><p id="roleLabel" class="portal-muted"></p></div><button id="logoutBtn" class="portal-btn">Keluar</button></div><div id="message" class="portal-status portal-hidden" role="status"></div></div>
<section id="tutorPanel" class="portal-panel portal-hidden"><h2>Presensi Hari Ini</h2><p id="todayDate" class="portal-muted"></p><label>Jadwal pertemuan<select id="tutorSchedule" required><option value="">Memuat jadwal...</option></select></label><div class="admin-form"><label>Nama murid<select id="tutorStudent" required><option value="">Pilih murid</option></select></label><label>Mata pelajaran<select id="tutorSubject" required><option value="">Pilih mapel</option><option>Calistung</option><option>All Mapel</option><option>English Course</option><option>Mengaji</option><option>Kreativitas</option></select></label><label>Paket pertemuan<select id="tutorPackage" required><option value="">Pilih paket</option></select></label><label>Alamat mengajar<input id="teachingAddress" type="text" placeholder="Alamat tempat mengajar" required></label></div><div class="portal-actions"><button id="checkInBtn" class="portal-btn">Presensi Masuk</button><button id="checkOutBtn" class="portal-btn" disabled>Presensi Pulang</button></div><p id="attendanceState" class="portal-muted"></p><h3>Riwayat Presensi Saya</h3><div style="overflow:auto"><table class="portal-table"><thead><tr><th>Tanggal</th><th>Kelas</th><th>Murid</th><th>Mapel</th><th>Masuk</th><th>Pulang</th><th>Durasi</th><th>Status</th></tr></thead><tbody id="tutorAttendanceHistory"><tr><td colspan="8">Memuat riwayat...</td></tr></tbody></table></div></section>
<section id="adminPanel" class="portal-hidden admin-layout">
<aside class="admin-sidebar">
  <div class="admin-sidebar-label">MENU ADMIN</div>
  <nav id="adminTabs" class="admin-nav">
    <button data-view="dashboard" class="active"><span class="nav-icon">▦</span><span>Dashboard</span></button>
    <button data-view="students"><span class="nav-icon">♙</span><span>Siswa</span></button>
    <button data-view="classes"><span class="nav-icon">▦</span><span>Kelas &amp; Jadwal</span></button>
    <button data-view="tutors"><span class="nav-icon">♧</span><span>Tutor</span></button>
    <button data-view="attendance"><span class="nav-icon">▣</span><span>Absensi</span></button>
    <button data-view="payments"><span class="nav-icon">▱</span><span>Pembayaran</span></button>
    <button data-view="reports"><span class="nav-icon">▥</span><span>Laporan</span></button>
  </nav>
  <div class="admin-sidebar-extra">
    <div class="admin-sidebar-label">PENGELOLAAN LAINNYA</div>
    <button data-view="programs">Program belajar</button>
    <button data-view="class_tutors">Tutor per kelas</button>
    <button data-view="class_students">Siswa per kelas</button>
    <button data-view="student_packages">Paket pertemuan</button>
    <button data-view="invoices">Tagihan</button>
    <button data-view="expenses">Pengeluaran</button>
  </div>
</aside>
<section id="adminContent" class="portal-panel admin-content"><p class="portal-muted">Memuat administrasi...</p></section>
</section></section></main><script src="portal.js"></script></body></html>
