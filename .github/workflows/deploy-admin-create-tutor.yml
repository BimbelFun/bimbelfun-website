name: Deploy Admin Create Tutor Edge Function

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/admin-create-tutor/**"
      - ".github/workflows/deploy-admin-create-tutor.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-admin-create-tutor
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing GitHub Actions secret: SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "Missing GitHub Actions secret: SUPABASE_PROJECT_ID"
            exit 1
          fi
          supabase functions deploy admin-create-tutor --project-ref "$SUPABASE_PROJECT_ID" --yes
